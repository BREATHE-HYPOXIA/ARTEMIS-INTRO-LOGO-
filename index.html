<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOST-Style Wipe Intro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Pitch Black Intro Screen */
    #intro-screen {
      position: fixed;
      inset: 0; /* Shorthand for top: 0, left: 0, right: 0, bottom: 0 */
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      
      /* Base state for the wipe effect */
      clip-path: inset(0 0 0 0);
      /* Animates the clip-path for a smooth left-to-right wipe */
      transition: clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease;
    }

    /* Triggered by JS: Wipes the screen from left to right */
    #intro-screen.hidden {
      clip-path: inset(0 0 0 100%); /* Pushes the left edge all the way to the right */
      opacity: 0.5; /* Slight fade as it wipes */
      pointer-events: none;
    }

    /* Logo Wrapper for the Shine Effect */
    .logo-wrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
      border-radius: 50%; /* Helps contain the shine to the circular boundaries of your logo */
    }

    .intro-logo {
      width: 200px;
      height: auto;
      display: block;
      /* Initial appearance animation */
      animation: logoAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* The Moving Shine Gradient */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-25deg);
      /* Runs the shine sweep after the logo finishes appearing */
      animation: logoShine 1.5s ease-in-out forwards;
      animation-delay: 0.8s; 
    }

    /* Keyframes for Appear */
    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Keyframes for Shine */
    @keyframes logoShine {
      0% {
        left: -150%;
      }
      100% {
        left: 200%;
      }
    }

    /* Main Website Layout */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #000000;
    }

    .header-logo {
      height: 36px;
      width: auto;
      border-radius: 50%;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #f8fafc;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
    }

    .hero p {
      font-size: 1.15rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="intro-screen">
    <div class="logo-wrapper">
      <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="intro-logo">
    </div>
  </div>

  <!-- Main Website Content -->
  <header>
    <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="header-logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Welcome to Your Official Site</h1>
    <p>The intro screen now features a horizontal left-to-right wipe transition using CSS clip-path, perfectly mimicking professional video reveals.</p>
  </main>

  <!-- JavaScript Setup -->
  <script>
    window.addEventListener("load", function () {
      const introScreen = document.getElementById("intro-screen");
      
      // Waits 2.6 seconds (allowing the fade-in and shine to finish) before triggering the horizontal wipe
      setTimeout(() => {
        introScreen.classList.add("hidden");
      }, 2600); 
    });
  </script>

</body>
</html>
