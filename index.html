<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOST-Style Violet & Blue Intro Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Rich Violet to Deep Blue Background Gradient */
      background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 50%, #0f172a 100%);
      background-attachment: fixed;
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Vibrant Deep Violet Intro Screen Overlay */
    #intro-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #2e1065, #1e1b4b);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      
      /* Base state for horizontal wipe reveal */
      clip-path: inset(0 0 0 0);
      transition: clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease;
    }

    /* Wipes screen away horizontally from left to right */
    #intro-screen.hidden {
      clip-path: inset(0 0 0 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    /* Logo Container with Bright Violet Glow */
    .logo-wrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
      border-radius: 50%;
      box-shadow: 0 0 45px rgba(168, 85, 247, 0.6);
    }

    .intro-logo {
      width: 180px;
      height: auto;
      display: block;
      animation: logoAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Moving Light Shine Gradient Across Logo */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(191, 219, 254, 0.8) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-25deg);
      animation: logoShine 1.2s ease-in-out forwards;
      animation-delay: 0.8s;
    }

    /* Keyframe Animations */
    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logoShine {
      0% {
        left: -150%;
      }
      100% {
        left: 200%;
      }
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      background-color: rgba(46, 16, 101, 0.6);
      backdrop-filter: blur(12px);
    }

    .header-logo {
      height: 36px;
      width: auto;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #c084fc;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: #cbd5e1;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    /* Violet to Blue Gradient Button */
    .btn {
      background: linear-gradient(135deg, #9333ea, #2563eb);
      color: white;
      padding: 0.75rem 2.2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 30px -5px rgba(147, 51, 234, 0.6);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.7);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <!-- Intro Screen Overlay -->
  <div id="intro-screen">
    <div class="logo-wrapper">
      <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="intro-logo">
    </div>
  </div>

  <!-- Main Website Content -->
  <header>
    <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="header-logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Welcome to Your Official Site</h1>
    <p>A modern portal featuring a DOST-style shine reveal and horizontal wipe, set against a rich violet and blue backdrop.</p>
    <a href="#" class="btn">Explore Portal</a>
  </main>

  <!-- JavaScript Setup with Fallback Safety -->
  <script>
    let introTriggered = false;

    function triggerWipe() {
      if (introTriggered) return;
      introTriggered = true;
      
      const introScreen = document.getElementById("intro-screen");
      if (introScreen) {
        setTimeout(() => {
          introScreen.classList.add("hidden");
        }, 2400);
      }
    }

    document.addEventListener("DOMContentLoaded", triggerWipe);
    window.addEventListener("load", triggerWipe);

    // Safety fallback timer
    setTimeout(() => {
      const introScreen = document.getElementById("intro-screen");
      if (introScreen && !introScreen.classList.contains("hidden")) {
        introScreen.classList.add("hidden");
      }
    }, 4000);
  </script>

</body>
</html>
