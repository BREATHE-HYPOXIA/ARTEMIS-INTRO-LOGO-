<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOST-Style Intro Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #f8fafc;
      overflow-x: hidden;
    }

    /* Pitch Black Intro Screen Overlay */
    #intro-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      
      /* Base state for horizontal wipe reveal */
      clip-path: inset(0 0 0 0);
      transition: clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1.2s ease;
    }

    /* Wipes screen away horizontally from left to right */
    #intro-screen.hidden {
      clip-path: inset(0 0 0 100%);
      opacity: 0.5;
      pointer-events: none;
    }

    /* Logo Container for Light Shine Effect */
    .logo-wrapper {
      position: relative;
      display: inline-block;
      overflow: hidden;
      border-radius: 50%;
    }

    .intro-logo {
      width: 180px;
      height: auto;
      display: block;
      animation: logoAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Moving Light Shine Gradient Across Logo */
    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: skewX(-25deg);
      animation: logoShine 1.2s ease-in-out forwards;
      animation-delay: 0.8s;
    }

    /* Keyframe Animations */
    @keyframes logoAppear {
      0% {
        opacity: 0;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes logoShine {
      0% {
        left: -150%;
      }
      100% {
        left: 200%;
      }
    }

    /* Main Website Layout */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #000000;
    }

    .header-logo {
      height: 36px;
      width: auto;
      border-radius: 50%;
    }

    nav a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #f8fafc;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
    }

    .hero p {
      font-size: 1.15rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <!-- Intro Screen Overlay -->
  <div id="intro-screen">
    <div class="logo-wrapper">
      <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="intro-logo">
    </div>
  </div>

  <!-- Main Website Content -->
  <header>
    <img src="Messenger_creation_5D401D20-0ED0-42E4-9952-D3425A217D30.jpeg" alt="Brand Logo" class="header-logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Welcome to Your Official Site</h1>
    <p>A high-performance modern website template built with a DOST-style logo shine and horizontal left-to-right wipe intro.</p>
    <a href="#" class="btn">Explore Portal</a>
  </main>

  <!-- JavaScript Setup with Fallback Safety -->
  <script>
    let introTriggered = false;

    function triggerWipe() {
      if (introTriggered) return;
      introTriggered = true;
      
      const introScreen = document.getElementById("intro-screen");
      if (introScreen) {
        // Waits 2.4s for the logo fade & shine animation to complete before wiping
        setTimeout(() => {
          introScreen.classList.add("hidden");
        }, 2400);
      }
    }

    // Runs immediately when DOM is ready (prevents getting stuck on slow networks)
    document.addEventListener("DOMContentLoaded", triggerWipe);
    window.addEventListener("load", triggerWipe);

    // Safety fallback: forces intro screen to wipe after 4s no matter what
    setTimeout(() => {
      const introScreen = document.getElementById("intro-screen");
      if (introScreen && !introScreen.classList.contains("hidden")) {
        introScreen.classList.add("hidden");
      }
    }, 4000);
  </script>

</body>
</html>
